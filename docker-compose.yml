services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://folio:folio@db:5432/folio
    ports:
      - "8000:8000"
    volumes:
      - ./library:/library:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
